name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 📦 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Check if the version is a release
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *"-SNAPSHOT"* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the deploy: $VERSION is a SNAPSHOT version, and only releases deploy."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    # Job-level `if` cannot read secrets, so the deploy step checks this flag instead.
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: home
            dir: home
            project: learning-animated-home
          - site: kafka
            dir: tracks/kafka
            project: learning-animated-kafka
          - site: quarkus
            dir: tracks/quarkus
            project: learning-animated-quarkus
          - site: java
            dir: tracks/java
            project: learning-animated-java
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 📦 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🇳 Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: ⚒️ Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: ⚙️ Install dependencies
        run: just ci

      - name: 🏗️ Build ${{ matrix.site }}
        run: just build ${{ matrix.site }}

      - name: ⏭️ Skip the deploy without Cloudflare secrets
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so ${{ matrix.site }} was built but not deployed."

      - name: 🚀 Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pages deploys every branch except `main` as a preview, so a tag run
          # must not pass its ref name.
          command: pages deploy ${{ matrix.dir }}/dist --project-name=${{ matrix.project }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
