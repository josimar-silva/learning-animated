<g data-role="verdict" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7000" values="0;1"/><text x="28" y="490" class="font-sans text-label font-semibold fill-ink">The mailer got TicketsIssued while A's transaction was still open, and found no tickets.</text><text x="28" y="510" class="font-sans text-label fill-ink-muted">A got 200 OK and its tickets are committed, but nobody emailed them.</text></g>
