<g data-state="committed" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3750" values="0;1"/><path d="M 52 92 H 44 V 177 H 52" class="fill-none stroke-violet stroke-2.5"/></g>
</g>
<g data-role="code" data-method="confirm" class="font-mono text-offset fill-ink">
<text x="64" y="104">@Transactional</text>
<text x="64" y="121">public void confirm(Order order) {</text>
<text x="82" y="138">tickets.issue(order);</text>
<text x="82" y="155">events.sendAndAwait(new TicketsIssued(order.id()));</text>
<text x="64" y="172">}</text>
</g>
<g class="font-sans text-offset">
<text x="480" y="104" class="fill-ink-muted">BEGIN when confirm() starts</text>
<text x="480" y="155" class="font-semibold fill-amber">the event is out before COMMIT</text>
<text x="480" y="172" class="fill-ink-muted">COMMIT when confirm() returns</text>
</g>
