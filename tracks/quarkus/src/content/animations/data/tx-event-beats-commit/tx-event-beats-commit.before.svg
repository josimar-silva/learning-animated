<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" data-loop="20s">
<title>The event arrives before the commit: before</title>
<desc>Checkout A runs confirm() in one transaction. It issues the tickets for seats A12 and A13, then sends a TicketsIssued event to the tickets-issued topic and waits until Kafka has it. The transaction commits only after confirm() returns. The mailer gets the event before that commit and looks up A's tickets. They are not committed yet, so it finds none and emails nothing. A gets 200 OK and the tickets are committed, but nobody emails them.</desc>
