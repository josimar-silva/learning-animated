<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" data-loop="20s">
<title>The provider outlives the transaction: after</title>
<desc>Checkout A holds seats A12 and A13 and stores a PENDING payment in a short transaction that commits before the charge. It calls the payment provider with no transaction open, so the reaper has nothing to roll back, and only the REST client's read timeout limits the call. The provider answers well before that timeout. A second short transaction confirms the order, sells the seats to A, and marks the payment paid, and A gets 200 OK.</desc>
