<g data-role="code" class="font-mono text-offset fill-ink">
<text x="64" y="104">@Transactional(TxType.NEVER)</text>
<text x="64" y="121">public TicketResult checkout(Order order) {</text>
<text x="82" y="138">QuarkusTransaction.requiringNew().run(() -&gt; orders.reserve(order));</text>
<text x="82" y="155">Charge charge = payments.charge(order);</text>
<text x="82" y="172">QuarkusTransaction.requiringNew().run(() -&gt; orders.confirm(order, charge));</text>
<text x="82" y="189">return TicketResult.issued(order);</text>
<text x="64" y="206">}</text>
</g>
<g class="font-sans text-offset">
<text x="650" y="104" class="fill-ink-muted">throws if a caller's transaction is open</text>
<text x="650" y="138" class="fill-ink-muted">BEGIN, hold seats, payment PENDING, COMMIT</text>
<text x="650" y="155" class="font-semibold fill-emerald">no transaction, only the read timeout</text>
<text x="650" y="172" class="fill-ink-muted">BEGIN, confirm the order, COMMIT</text>
</g>
