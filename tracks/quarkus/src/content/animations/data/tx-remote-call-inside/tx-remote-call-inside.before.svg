<!-- Timeline: a moment t seconds into the loop sits at x = 160 + 50t, and the reveal clip and the playhead reach x = 860 at 14 s. -->
<g clip-path="url(#reveal)">
<g data-role="transaction" data-request="A" data-tx="checkout">
<g data-state="open" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0500;0.6250" values="0;1;0"/><rect x="210" y="246" width="575" height="46" rx="8" class="la-cell-new"/><text x="218" y="259" font-size="11" class="font-sans fill-cell-ink">transaction</text></g>
<g data-state="committed" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6250" values="0;1"/><rect x="210" y="246" width="575" height="46" rx="8" class="la-card"/><text x="218" y="259" font-size="11" class="font-sans fill-ink">committed</text></g>
</g>
<g data-role="transaction" data-request="B" data-tx="checkout">
<g data-state="open" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2500;0.6500" values="0;1;0"/><rect x="410" y="394" width="400" height="46" rx="8" class="la-cell-new"/><text x="418" y="407" font-size="11" class="font-sans fill-cell-ink">transaction</text></g>
<g data-state="rolled-back" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6500" values="0;1"/><rect x="410" y="394" width="400" height="46" rx="8" class="fill-surface stroke-red stroke-1.5"/><text x="418" y="407" font-size="11" class="font-sans fill-red">rolled back</text></g>
</g>
<g data-role="call" data-request="A" data-call="hold" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0500" values="0;1"/><rect x="214" y="266" width="67" height="22" rx="5" class="fill-surface stroke-sky stroke-1.5"/><text x="247.5" y="281" class="font-sans text-offset fill-ink anchor-middle">hold seats</text></g>
<g data-role="call" data-request="A" data-call="charge" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1500" values="0;1"/><rect x="314" y="266" width="367" height="22" rx="5" class="fill-surface stroke-sky stroke-1.5"/><text x="323" y="281" class="font-mono text-offset fill-ink">payments.charge(order)</text></g>
<g data-role="call" data-request="A" data-call="confirm" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5500" values="0;1"/><rect x="714" y="266" width="67" height="22" rx="5" class="fill-surface stroke-sky stroke-1.5"/><text x="747.5" y="281" class="font-sans text-offset fill-ink anchor-middle">confirm</text></g>
<g data-role="seat-status" data-state="free"><rect x="161" y="306" width="73" height="30" rx="6" class="fill-surface stroke-grid stroke-1.5"/><text x="197.5" y="325" class="font-sans text-offset fill-ink-muted anchor-middle">free</text></g>
<g data-role="seat-lock">
<g data-state="held" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0750;0.6250" values="0;1;0"/><rect x="236" y="306" width="548" height="30" rx="6" class="la-cell-new"/><text x="245" y="325" class="font-sans text-offset fill-cell-ink">locked by A's open transaction</text></g>
<g data-state="released" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6250" values="0;1"/><rect x="236" y="306" width="548" height="30" rx="6" class="fill-cell-new"/><text x="245" y="325" class="font-sans text-offset fill-cell-ink">locked by A's open transaction</text></g>
</g>
<g data-role="seat-status" data-state="sold" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6250" values="0;1"/><rect x="786" y="306" width="73" height="30" rx="6" class="la-card"/><text x="822.5" y="325" class="font-sans text-offset fill-ink anchor-middle">sold to A</text></g>
<g data-role="charge" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1500" values="0;1"/><rect x="311" y="350" width="373" height="30" rx="6" class="fill-surface stroke-slate stroke-1.5"/><text x="320" y="369" class="font-sans text-offset fill-ink">charging the card</text></g>
<g data-role="lock-wait" data-request="B" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2500" values="0;1"/><rect x="414" y="414" width="367" height="22" rx="5" fill="url(#hatch)" class="stroke-pink stroke-1.5"/><rect x="420" y="418" width="250" height="14" rx="3" class="fill-surface"/><text x="423" y="429" class="font-sans text-offset font-semibold fill-red">seats.hold(order) waits for A's row locks</text></g>
</g>
<g data-role="charged" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5250" values="0;1"/><text x="693" y="369" class="font-sans text-offset font-semibold fill-emerald">charged</text></g>
<g data-role="response" data-request="A" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6500" values="0;1"/><text x="818" y="281" class="font-sans text-offset font-semibold fill-emerald">200 OK</text></g>
<g data-role="response" data-request="B" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6500" values="0;1"/><text x="818" y="429" class="font-sans text-offset font-semibold fill-red">409 Conflict</text></g>
<line x1="160" y1="458" x2="866" y2="458" class="la-arrow"/>
<polygon points="874,458 866,454 866,462" class="fill-flow"/>
<text x="882" y="462" class="la-note">time</text>
<g data-role="playhead"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7000" values="1;0"/><g><animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.7000;1.0000" values="0,0;700,0;700,0"/><line x1="160" y1="238" x2="160" y2="448" class="stroke-flow-strong stroke-1.5"/></g></g>
<g data-role="verdict" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7000" values="0;1"/><text x="28" y="490" class="font-sans text-label font-semibold fill-ink">A12 and A13 stayed locked for the whole charge.</text><text x="28" y="510" class="font-sans text-label fill-ink-muted">B waited on those locks just to get a 409.</text></g>
<rect x="28" y="531" width="18" height="12" rx="3" class="la-cell-new"/><text x="54" y="541" class="font-sans text-offset fill-ink-muted">open, not committed yet</text>
<rect x="222" y="531" width="18" height="12" rx="3" class="la-card"/><text x="248" y="541" class="font-sans text-offset fill-ink-muted">committed</text>
<rect x="330" y="531" width="18" height="12" rx="3" class="fill-surface stroke-red stroke-1.5"/><text x="356" y="541" class="font-sans text-offset fill-ink-muted">rolled back</text>
<rect x="452" y="531" width="18" height="12" rx="3" fill="url(#hatch)" class="stroke-pink stroke-1.5"/><text x="478" y="541" class="font-sans text-offset fill-ink-muted">waiting for a row lock</text>
<text x="28" y="576" class="font-sans text-offset fill-ink-muted">Sources: quarkus.io/guides/transaction (declarative and programmatic approaches) and postgresql.org/docs (row-level locks).</text>
