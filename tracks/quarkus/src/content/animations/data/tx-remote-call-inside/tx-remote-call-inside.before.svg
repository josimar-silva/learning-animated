<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" data-loop="20s">
<title>A remote call inside the transaction: before</title>
<desc>Checkout A runs in one transaction from start to finish. It holds seats A12 and A13 with an UPDATE, which locks their rows, calls the payment provider and waits for the charge, then confirms the order and commits. The rows stay locked for the whole charge. Checkout B wants the same seats, so it waits on A's locks until A commits, then rolls back and gets 409 Conflict.</desc>
