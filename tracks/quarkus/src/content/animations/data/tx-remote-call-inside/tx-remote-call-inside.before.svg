<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="7" height="7" class="fill-surface"/>
<line x1="0" y1="0" x2="0" y2="7" class="stroke-red stroke-2.5"/>
</pattern>
<clipPath id="reveal"><rect x="156" y="238" width="4" height="210"><animate attributeName="width" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.7000;1.0000" values="4;704;704"/></rect></clipPath>
</defs>
<rect x="0" y="0" width="960" height="592" class="fill-stage"/>
<text x="28" y="40" class="la-title">Before: one transaction around the whole checkout</text>
<text x="28" y="62" class="la-note">@Transactional opens the transaction when checkout() starts and commits it when checkout() returns.</text>
<rect x="24" y="80" width="912" height="144" rx="10" class="la-canvas"/>
<g data-role="code-line" data-call="hold" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0500;0.1250" values="0;1;0"/><rect x="58" y="126" width="578" height="16" rx="3" class="fill-cell"/><rect x="58" y="126" width="3" height="16" class="fill-sky"/></g>
<g data-role="code-line" data-call="charge" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1500;0.5250" values="0;1;0"/><rect x="58" y="143" width="578" height="16" rx="3" class="fill-cell"/><rect x="58" y="143" width="3" height="16" class="fill-sky"/></g>
<g data-role="code-line" data-call="confirm" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5500;0.6250" values="0;1;0"/><rect x="58" y="160" width="578" height="16" rx="3" class="fill-cell"/><rect x="58" y="160" width="3" height="16" class="fill-sky"/></g>
<g data-role="code-transaction" data-tx="checkout">
<g data-state="dormant"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0500" values="1;0"/><path d="M 52 92 H 44 V 211 H 52" class="fill-none stroke-grid stroke-2.5"/></g>
<g data-state="open" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0500;0.6250" values="0;1;0"/><path d="M 52 92 H 44 V 211 H 52" class="fill-none stroke-amber stroke-2.5"/></g>
<g data-state="committed" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6250" values="0;1"/><path d="M 52 92 H 44 V 211 H 52" class="fill-none stroke-violet stroke-2.5"/></g>
</g>
<g data-role="code" class="font-mono text-offset fill-ink">
<text x="64" y="104">@Transactional</text>
<text x="64" y="121">public TicketResult checkout(Order order) {</text>
<text x="82" y="138">seats.hold(order);</text>
<text x="82" y="155">Charge charge = payments.charge(order);</text>
<text x="82" y="172">orders.confirm(order, charge);</text>
<text x="82" y="189">return TicketResult.issued(order);</text>
<text x="64" y="206">}</text>
</g>
<g class="font-sans text-offset">
<text x="650" y="104" class="fill-ink-muted">BEGIN when checkout() starts</text>
<text x="650" y="155" class="font-semibold fill-amber">A12 and A13 stay locked meanwhile</text>
<text x="650" y="206" class="fill-ink-muted">COMMIT when checkout() returns</text>
</g>
<g class="font-sans">
<text x="28" y="265" class="text-label font-semibold fill-ink">checkout</text>
<circle cx="100" cy="261" r="9" class="fill-sky"/>
<text x="100" y="265" class="text-offset font-bold fill-surface anchor-middle">A</text>
<text x="28" y="282" class="font-mono text-offset fill-ink-muted">POST /checkout</text>
<text x="28" y="318" class="text-label font-semibold fill-ink">database</text>
<text x="28" y="333" class="text-offset fill-ink-muted">seats A12, A13</text>
<text x="28" y="362" class="text-label font-semibold fill-ink">payment provider</text>
<text x="28" y="377" class="font-mono text-offset fill-ink-muted">POST /charges</text>
<text x="28" y="413" class="text-label font-semibold fill-ink">checkout</text>
<circle cx="100" cy="409" r="9" class="fill-pink"/>
<text x="100" y="413" class="text-offset font-bold fill-surface anchor-middle">B</text>
<text x="28" y="430" class="font-mono text-offset fill-ink-muted">POST /checkout</text>
</g>
