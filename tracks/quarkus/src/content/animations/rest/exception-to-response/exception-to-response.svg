<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" role="img" data-loop="20s">
  <title>How an exception becomes a response</title>
  <desc>A checkout request travels from the client through Quarkus REST, CheckoutResource, and CheckoutService to the inventory database. Seat F14 is already held, so the service throws SeatAlreadyTaken, which passes back through the service and the endpoint uncaught. Quarkus REST finds the @ServerExceptionMapper that takes it, and the mapper answers 409 Conflict. A second checkout runs while the database is down: the query throws PersistenceException, no mapper takes it, and Quarkus answers 500 Internal Server Error.</desc>
  <style>
/* LA-STYLE:START */
