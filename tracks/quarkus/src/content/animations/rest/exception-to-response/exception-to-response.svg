  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path class="fill-flow" d="M 0 0 L 9 4.5 L 0 9 Z"/>
    </marker>
  </defs>
  <rect class="fill-stage" width="1000" height="476"/>
  <text class="la-title" x="32" y="44">How an exception becomes a response</text>
  <text class="la-note" x="32" y="68">The endpoint has no try/catch. Quarkus REST turns whatever escapes it into an HTTP status.</text>
  <g data-role="layer" data-layer="client">
    <rect class="la-canvas stroke-1.5" x="32" y="92" width="184" height="84" rx="10"/>
    <text class="fill-ink text-label font-sans font-semibold" x="124" y="124" text-anchor="middle">client</text>
    <text class="fill-ink-muted text-offset font-sans" x="124" y="146" text-anchor="middle">browser</text>
  </g>
  <g data-role="layer" data-layer="rest">
    <rect class="la-canvas stroke-1.5" x="240" y="92" width="180" height="84" rx="10"/>
    <text class="fill-ink text-label font-sans font-semibold" x="330" y="124" text-anchor="middle">Quarkus REST</text>
    <text class="fill-ink-muted text-offset font-sans" x="330" y="146" text-anchor="middle">maps exceptions</text>
  </g>
  <g data-role="layer" data-layer="endpoint">
    <rect class="la-canvas stroke-1.5" x="444" y="92" width="168" height="84" rx="10"/>
    <text class="fill-ink text-label font-mono font-semibold" x="528" y="124" text-anchor="middle">CheckoutResource</text>
    <text class="fill-ink-muted text-offset font-mono" x="528" y="146" text-anchor="middle">POST /checkout</text>
  </g>
  <g data-role="layer" data-layer="service">
    <rect class="la-canvas stroke-1.5" x="636" y="92" width="168" height="84" rx="10"/>
    <text class="fill-ink text-label font-mono font-semibold" x="720" y="124" text-anchor="middle">CheckoutService</text>
    <text class="fill-ink-muted text-offset font-mono" x="720" y="146" text-anchor="middle">checkout(order)</text>
  </g>
  <g data-role="layer" data-layer="inventory">
    <rect class="la-canvas stroke-1.5" x="828" y="92" width="140" height="84" rx="10"/>
    <text class="fill-ink text-label font-sans font-semibold" x="898" y="124" text-anchor="middle">inventory</text>
    <text class="fill-ink-muted text-offset font-sans" x="898" y="146" text-anchor="middle">database</text>
  </g>
  <path class="la-arrow" d="M 124 200 H 890" marker-end="url(#head)"/>
  <path class="la-arrow" d="M 720 232 H 132" stroke-dasharray="6 4" marker-end="url(#head)"/>
  <g data-role="mapper">
    <rect class="la-card" x="32" y="280" width="480" height="137" rx="10"/>
    <text class="fill-ink text-offset font-mono" x="48" y="306">class CheckoutMappers {</text>
    <text class="fill-ink text-offset font-mono" x="63" y="325">@ServerExceptionMapper</text>
    <text class="fill-ink text-offset font-mono" x="63" y="344">public RestResponse&lt;String&gt; seatTaken(SeatAlreadyTaken e) {</text>
    <text class="fill-ink text-offset font-mono" x="78" y="363">return RestResponse.status(CONFLICT, e.getMessage());</text>
    <text class="fill-ink text-offset font-mono" x="63" y="382">}</text>
    <text class="fill-ink text-offset font-mono" x="48" y="401">}</text>
  </g>
  <g data-role="endpoint-code">
    <rect class="la-card" x="528" y="280" width="440" height="137" rx="10"/>
    <text class="fill-ink text-offset font-mono" x="544" y="306">@Path(&quot;/checkout&quot;) class CheckoutResource {</text>
    <text class="fill-ink text-offset font-mono" x="559" y="325">@POST</text>
    <text class="fill-ink text-offset font-mono" x="559" y="344">public TicketResult checkout(Order order) {</text>
    <text class="fill-ink text-offset font-mono" x="574" y="363">return service.checkout(order); // no try/catch</text>
    <text class="fill-ink text-offset font-mono" x="559" y="382">}</text>
    <text class="fill-ink text-offset font-mono" x="544" y="401">}</text>
  </g>
  <g data-role="seat-held">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1500;0.3250" values="0;1;0"/>
    <text class="fill-ink-muted text-offset font-sans font-semibold" x="898" y="166" text-anchor="middle">F14 already held</text>
  </g>
  <g data-role="database-down">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4750" values="0;1"/>
    <rect class="fill-none stroke-red stroke-2.5" x="826" y="90" width="144" height="88" rx="12"/>
    <text class="fill-red text-offset font-sans font-semibold" x="898" y="166" text-anchor="middle">down</text>
  </g>
  <g data-role="mapper-match">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3250;0.4750" values="0;1;0"/>
    <rect class="fill-none stroke-emerald stroke-2.5" x="28" y="276" width="488" height="145" rx="14"/>
    <text class="fill-emerald text-offset font-sans font-semibold" x="330" y="166" text-anchor="middle">seatTaken() matches</text>
  </g>
  <g data-role="no-mapper">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8000" values="0;1"/>
    <text class="fill-red text-offset font-sans font-semibold" x="330" y="166" text-anchor="middle">no mapper matches</text>
  </g>
  <circle data-role="request" data-round="1" class="fill-flow-strong" r="7">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0250;0.1500" values="0;1;0"/>
    <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0250;0.1500;1.0000" values="124,200;124,200;886,200;886,200"/>
  </circle>
  <circle data-role="request" data-round="2" class="fill-flow-strong" r="7">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5000;0.6250" values="0;1;0"/>
    <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5000;0.6250;1.0000" values="124,200;124,200;886,200;886,200"/>
  </circle>
  <g data-role="exception" data-exception="SeatAlreadyTaken">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1750;0.3250" values="0;1;0"/>
    <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2000;0.2500;0.3000;1.0000" values="720,232;720,232;528,232;330,232;330,232"/>
    <rect class="fill-surface stroke-red stroke-1.5" x="-70" y="-12" width="140" height="24" rx="4"/>
    <text class="fill-red text-offset font-mono font-semibold" x="0" y="4" text-anchor="middle">SeatAlreadyTaken</text>
  </g>
  <text data-role="uncaught" data-layer="service" data-exception="SeatAlreadyTaken" class="fill-red text-offset font-sans font-semibold halo" x="720" y="262" text-anchor="middle">not caught<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2000;0.3250" values="0;1;0"/></text>
  <text data-role="uncaught" data-layer="endpoint" data-exception="SeatAlreadyTaken" class="fill-red text-offset font-sans font-semibold halo" x="528" y="262" text-anchor="middle">not caught<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2500;0.3250" values="0;1;0"/></text>
  <g data-role="exception" data-exception="PersistenceException">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6500;0.8000" values="0;1;0"/>
    <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6750;0.7250;0.7750;1.0000" values="720,232;720,232;528,232;330,232;330,232"/>
    <rect class="fill-surface stroke-red stroke-1.5" x="-84" y="-12" width="168" height="24" rx="4"/>
    <text class="fill-red text-offset font-mono font-semibold" x="0" y="4" text-anchor="middle">PersistenceException</text>
  </g>
  <text data-role="uncaught" data-layer="service" data-exception="PersistenceException" class="fill-red text-offset font-sans font-semibold halo" x="720" y="262" text-anchor="middle">not caught<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6750;0.8000" values="0;1;0"/></text>
  <text data-role="uncaught" data-layer="endpoint" data-exception="PersistenceException" class="fill-red text-offset font-sans font-semibold halo" x="528" y="262" text-anchor="middle">not caught<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7250;0.8000" values="0;1;0"/></text>
  <g data-role="response" data-status="409">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3500;0.4750" values="0;1;0"/>
    <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.3500;0.4000;1.0000" values="330,232;330,232;124,232;124,232"/>
    <rect class="fill-amber" x="-56" y="-12" width="112" height="24" rx="12"/>
    <text class="fill-surface text-offset font-sans font-bold" x="0" y="4" text-anchor="middle">409 Conflict</text>
  </g>
  <g data-role="response" data-status="500">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8250" values="0;1"/>
    <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.8250;0.8750;1.0000" values="330,232;330,232;124,232;124,232"/>
    <rect class="fill-surface stroke-red stroke-1.5" x="-92" y="-12" width="184" height="24" rx="12"/>
    <text class="fill-red text-offset font-sans font-bold" x="0" y="4" text-anchor="middle">500 Internal Server Error</text>
  </g>
  <text data-role="caption" class="la-label" x="32" y="452">A buyer checks out seat F14. The request goes through the endpoint and the service to the inventory database.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1750" values="1;0"/></text>
  <text data-role="caption" class="la-label" x="32" y="452">F14 is already held, so the service throws SeatAlreadyTaken. Nothing in the service or the endpoint catches it.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1750;0.3250" values="0;1;0"/></text>
  <text data-role="caption" class="la-label" x="32" y="452">Quarkus REST finds the @ServerExceptionMapper that takes SeatAlreadyTaken, and the mapper answers 409 Conflict.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3250;0.4750" values="0;1;0"/></text>
  <text data-role="caption" class="la-label" x="32" y="452">A second buyer checks out, but the inventory database is down.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4750;0.6500" values="0;1;0"/></text>
  <text data-role="caption" class="la-label" x="32" y="452">The seat query throws PersistenceException, which escapes the service and the endpoint the same way.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6500;0.8000" values="0;1;0"/></text>
  <text data-role="caption" class="la-label" x="32" y="452">No mapper takes PersistenceException, so Quarkus answers 500 Internal Server Error.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8000" values="0;1"/></text>
</svg>
