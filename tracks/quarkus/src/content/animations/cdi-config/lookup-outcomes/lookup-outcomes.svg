<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" data-loop="20s">
  <title>What a lookup answers</title>
  <desc>Checkout looks up a PaymentGateway through Instance. Two classes implement it, CardGateway and SandboxGateway, and both are beans marked with @LookupIfProperty on payment.gateway. Started without the property, neither condition holds: no bean is left, isUnsatisfied() is true, and get() throws UnsatisfiedResolutionException. Restarted with card, only CardGateway is left, so isResolvable() is true and get() returns it. Then SandboxGateway loses its condition, and with card both beans are left: isAmbiguous() is true, and get() throws AmbiguousResolutionException.</desc>
  <style>
