<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" data-loop="20s">
  <title>Configuration picks the adapter: runtime</title>
  <desc>Checkout charges through a PaymentGateway, and two classes implement it: CardGateway and SandboxGateway, each marked with @LookupIfProperty on payment.gateway. One build turns both into beans, and checkout injects Instance&lt;PaymentGateway&gt;. Started with payment.gateway set to card, get() returns CardGateway and skips SandboxGateway. Restarted with sandbox, the same build returns SandboxGateway.</desc>
  <style>
/* LA-STYLE:START */
