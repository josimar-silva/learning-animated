  <rect class="la-canvas" x="8" y="8" width="944" height="474" rx="16"/>
  <text class="la-title" x="32" y="46">Runtime: @LookupIfProperty</text>
  <text class="la-note" x="32" y="70">Both adapters stay beans. At startup, payment.gateway decides which one the lookup returns.</text>

  <rect class="la-card" x="24" y="92" width="252" height="288" rx="10"/>
  <text class="font-sans text-label font-semibold fill-ink" x="40" y="116">source code</text>
  <text class="font-sans text-offset fill-ink-muted" x="40" y="134">two classes implement PaymentGateway</text>
  <g class="font-mono text-offset">
    <g data-role="class" data-adapter="card">
      <rect class="fill-stage stroke-grid stroke-1.5" x="36" y="150" width="228" height="102" rx="8"/>
      <text class="fill-ink-muted" x="46" y="170">@ApplicationScoped</text>
      <text class="fill-ink" x="46" y="186">@LookupIfProperty(</text>
      <text class="fill-ink" x="60" y="202">name = "payment.gateway",</text>
      <text class="fill-ink" x="60" y="218">stringValue = "card")</text>
      <text class="fill-ink" x="46" y="238">class <tspan class="font-semibold fill-sky">CardGateway</tspan></text>
    </g>
    <g data-role="class" data-adapter="sandbox">
      <rect class="fill-stage stroke-grid stroke-1.5" x="36" y="264" width="228" height="102" rx="8"/>
      <text class="fill-ink-muted" x="46" y="284">@ApplicationScoped</text>
      <text class="fill-ink" x="46" y="300">@LookupIfProperty(</text>
      <text class="fill-ink" x="60" y="316">name = "payment.gateway",</text>
      <text class="fill-ink" x="60" y="332">stringValue = "sandbox")</text>
      <text class="fill-ink" x="46" y="352">class <tspan class="font-semibold fill-pink">SandboxGateway</tspan></text>
    </g>
  </g>
  <g data-role="check" opacity="0">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.25;0.4;0.45" values="0;1;0;1;0"/>
    <rect class="fill-none stroke-amber stroke-1.5" x="54" y="205" width="188" height="18" rx="4"/>
    <rect class="fill-none stroke-amber stroke-1.5" x="54" y="319" width="188" height="18" rx="4"/>
  </g>

  <line class="la-arrow" x1="276" y1="154" x2="300" y2="154"/>
  <polygon class="fill-flow" points="308,154 300,150 300,158"/>
  <line class="la-arrow" x1="528" y1="154" x2="552" y2="154"/>
  <polygon class="fill-flow" points="560,154 552,150 552,158"/>
  <line class="la-arrow" x1="528" y1="318" x2="552" y2="318"/>
  <polygon class="fill-flow" points="560,318 552,314 552,322"/>

  <rect class="fill-stage stroke-grid stroke-1.5" x="308" y="92" width="220" height="124" rx="10"/>
  <g data-role="build-run">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.15" values="1;0"/>
    <rect class="fill-none stroke-amber stroke-2.5" x="308" y="92" width="220" height="124" rx="10"/>
  </g>
  <text class="font-sans text-label font-semibold fill-ink" x="324" y="116">build</text>
  <g class="font-mono text-offset">
    <text class="fill-ink-muted" x="324" y="136">./mvnw package</text>
    <text class="fill-ink-muted" x="324" y="166">payment.gateway</text>
    <rect class="la-cell-tail" x="324" y="176" width="96" height="24" rx="4"/>
  </g>
  <text class="font-sans text-offset fill-ink-muted" x="432" y="192">not checked</text>

  <rect class="fill-stage stroke-grid stroke-1.5" x="308" y="256" width="220" height="124" rx="10"/>
  <g data-role="start-run" opacity="0">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.25;0.4;0.45" values="0;1;0;1;0"/>
    <rect class="fill-none stroke-amber stroke-2.5" x="308" y="256" width="220" height="124" rx="10"/>
  </g>
  <text class="font-sans text-label font-semibold fill-ink" x="324" y="280">start</text>
  <g class="font-mono text-offset">
    <text class="fill-ink-muted" x="324" y="300">java -jar quarkus-run.jar</text>
    <text class="fill-ink-muted" x="324" y="330">payment.gateway</text>
    <rect class="la-cell-tail" x="324" y="340" width="96" height="24" rx="4"/>
    <g data-role="start-value" data-value="card" opacity="0">
      <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4" values="0;1;0"/>
      <rect class="la-cell" x="324" y="340" width="96" height="24" rx="4"/>
      <text class="fill-sky anchor-middle" x="372" y="356">card</text>
    </g>
    <g data-role="start-value" data-value="sandbox" opacity="0">
      <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4;0.975" values="0;1;0"/>
      <rect class="la-cell" x="324" y="340" width="96" height="24" rx="4"/>
      <text class="fill-pink anchor-middle" x="372" y="356">sandbox</text>
    </g>
  </g>

  <rect class="la-card" x="560" y="92" width="376" height="288" rx="10"/>
  <text class="font-sans text-label font-semibold fill-ink" x="576" y="116">application</text>
  <text class="font-sans text-offset fill-ink-muted" x="576" y="134">beans in the CDI container</text>
  <g class="anchor-middle">
    <g data-role="bean" data-adapter="card" opacity="0">
      <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1;0.975" values="0;1;0"/>
      <rect class="fill-surface stroke-sky stroke-1.5" x="576" y="148" width="164" height="60" rx="8"/>
      <text class="font-mono text-label font-semibold fill-sky" x="658" y="174">CardGateway</text>
      <text class="font-sans text-offset fill-ink-muted" x="658" y="194">charges the card</text>
    </g>
    <g data-role="bean" data-adapter="sandbox" opacity="0">
      <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1;0.975" values="0;1;0"/>
      <rect class="fill-surface stroke-pink stroke-1.5" x="756" y="148" width="164" height="60" rx="8"/>
      <text class="font-mono text-label font-semibold fill-pink" x="838" y="174">SandboxGateway</text>
      <text class="font-sans text-offset fill-ink-muted" x="838" y="194">fakes the charge</text>
    </g>
    <g class="font-sans text-offset fill-ink-muted">
      <g data-role="skipped" data-adapter="card" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.45;0.975" values="0;1;0"/>
        <text x="658" y="231">skipped by get()</text>
      </g>
      <g data-role="skipped" data-adapter="sandbox" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.4" values="0;1;0"/>
        <text x="838" y="231">skipped by get()</text>
      </g>
    </g>
  </g>

  <rect class="fill-stage stroke-grid stroke-1.5" x="576" y="248" width="344" height="116" rx="8"/>
  <g class="font-mono">
    <text class="text-label font-semibold fill-ink" x="592" y="272">CheckoutService</text>
    <text data-role="injection" class="text-offset fill-ink" x="592" y="296">@Inject Instance&lt;PaymentGateway&gt; gateway;</text>
    <text class="text-offset fill-ink-muted" x="592" y="316">gateway.get().charge(order);</text>
  </g>
  <g data-role="resolved" data-adapter="card" opacity="0">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.4" values="0;1;0"/>
    <rect class="fill-none stroke-amber stroke-2.5" x="572" y="144" width="172" height="68" rx="10"/>
    <line class="fill-none stroke-amber stroke-2.5" x1="658" y1="246" x2="658" y2="223"/>
    <polygon class="fill-amber" points="658,214 653,223 663,223"/>
    <text class="font-sans text-offset font-semibold fill-sky" x="592" y="346">get() returns CardGateway</text>
  </g>
  <g data-role="resolved" data-adapter="sandbox" opacity="0">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.45;0.975" values="0;1;0"/>
    <rect class="fill-none stroke-amber stroke-2.5" x="752" y="144" width="172" height="68" rx="10"/>
    <line class="fill-none stroke-amber stroke-2.5" x1="838" y1="246" x2="838" y2="223"/>
    <polygon class="fill-amber" points="838,214 833,223 843,223"/>
    <text class="font-sans text-offset font-semibold fill-pink" x="592" y="346">get() returns SandboxGateway</text>
  </g>

  <rect class="fill-stage stroke-grid stroke-1.5" x="24" y="394" width="912" height="40" rx="8"/>
  <g class="font-sans text-label fill-ink anchor-middle">
    <text data-role="caption" x="480" y="419">The build doesn't check @LookupIfProperty, so both adapters become beans.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2" values="1;0"/></text>
    <text data-role="caption" x="480" y="419" opacity="0">Started with payment.gateway=card, gateway.get() skips SandboxGateway and returns CardGateway.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4" values="0;1;0"/></text>
    <text data-role="caption" x="480" y="419" opacity="0">Restarted with sandbox, the same build returns SandboxGateway, with no rebuild.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4;0.65" values="0;1;0"/></text>
    <text data-role="caption" x="480" y="419" opacity="0">A plain @Inject would match two beans and fail as ambiguous, so checkout asks Instance for one.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.65;0.975" values="0;1;0"/></text>
  </g>

  <text class="font-sans text-offset fill-ink-muted" x="32" y="460">Source: quarkus.io/guides/cdi-reference (choosing beans for programmatic lookup).</text>
</svg>
