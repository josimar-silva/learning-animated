  <rect class="fill-stage" width="960" height="466"/>
  <text class="la-title" x="28" y="40">A sealed hierarchy</text>
  <text class="la-note" x="28" y="64">The decoder returns a DecodeResult. Its permits clause lets javac check that a switch covers every subtype.</text>
  <rect class="la-canvas stroke-1.5" x="24" y="84" width="912" height="216" rx="12"/>
  <line class="stroke-grid" x1="464" y1="96" x2="464" y2="288"/>
  <text class="la-label font-semibold" x="40" y="108">the sealed interface</text>
  <text class="la-label font-semibold" x="480" y="108">a switch over it</text>
  <rect class="la-card" x="40" y="120" width="360" height="52" rx="8"/>
  <text class="font-mono text-offset fill-ink" x="52" y="142"><tspan class="font-bold">sealed</tspan> interface DecodeResult</text>
  <rect data-role="permits-highlight" class="fill-none stroke-amber stroke-1.5" x="75" y="148" width="216.4" height="20" rx="4"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2500" values="1;0"/></rect>
  <text data-role="permits" class="font-mono text-offset fill-ink" x="81" y="162">permits <tspan data-role="type-name" data-type="Decoded" class="font-semibold fill-sky">Decoded</tspan>, <tspan data-role="type-name" data-type="Rejected" class="font-semibold fill-pink">Rejected</tspan> {}<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5000" values="1;0"/></text>
  <text data-role="permits" class="font-mono text-offset fill-ink" x="81" y="162">permits <tspan data-role="type-name" data-type="Decoded" class="font-semibold fill-sky">Decoded</tspan>, <tspan data-role="type-name" data-type="Rejected" class="font-semibold fill-pink">Rejected</tspan>, <tspan data-role="type-name" data-type="Expired" class="font-semibold fill-amber">Expired</tspan> {}<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5000" values="0;1"/></text>
  <g data-role="subtype" data-type="Decoded">
    <path class="la-arrow" d="M 60 172 V 198 H 76"/>
    <rect class="la-cell" x="76" y="184" width="300" height="28" rx="6"/>
    <text class="font-mono text-offset fill-ink" x="88" y="202">record <tspan data-role="type-name" data-type="Decoded" class="font-semibold fill-sky">Decoded</tspan>(BoardingPass pass)</text>
  </g>
  <g data-role="subtype" data-type="Rejected">
    <path class="la-arrow" d="M 60 198 V 234 H 76"/>
    <rect class="la-cell" x="76" y="220" width="300" height="28" rx="6"/>
    <text class="font-mono text-offset fill-ink" x="88" y="238">record <tspan data-role="type-name" data-type="Rejected" class="font-semibold fill-pink">Rejected</tspan>(String reason)</text>
  </g>
  <g data-role="subtype" data-type="Expired">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5000" values="0;1"/>
    <path class="la-arrow" d="M 60 234 V 270 H 76"/>
    <rect class="la-cell-new" x="76" y="256" width="300" height="28" rx="6"/>
    <text class="font-mono text-offset fill-ink" x="88" y="274">record <tspan data-role="type-name" data-type="Expired" class="font-semibold fill-amber">Expired</tspan>(BoardingPass pass)</text>
  </g>
  <g data-role="mark" data-mark="covered" data-type="Decoded">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3000" values="0;1"/>
    <path class="fill-none stroke-emerald stroke-1.5" d="M 386 198 l 4 4 l 8 -9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="font-sans text-offset font-semibold fill-emerald" x="402" y="202">covered</text>
  </g>
  <g data-role="mark" data-mark="covered" data-type="Rejected">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3500" values="0;1"/>
    <path class="fill-none stroke-emerald stroke-1.5" d="M 386 234 l 4 4 l 8 -9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="font-sans text-offset font-semibold fill-emerald" x="402" y="238">covered</text>
  </g>
  <g data-role="mark" data-mark="missing" data-type="Expired">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5500;0.7500" values="0;1;0"/>
    <path class="fill-none stroke-red stroke-1.5" d="M 387 265 l 9 9 m 0 -9 l -9 9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="font-sans text-offset font-semibold fill-red" x="402" y="274">no case</text>
  </g>
  <g data-role="mark" data-mark="covered" data-type="Expired">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8000" values="0;1"/>
    <path class="fill-none stroke-emerald stroke-1.5" d="M 386 270 l 4 4 l 8 -9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="font-sans text-offset font-semibold fill-emerald" x="402" y="274">covered</text>
  </g>
  <rect data-role="switch-error" class="fill-none stroke-red stroke-1.5" x="503" y="148" width="187.2" height="20" rx="4"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6000;0.7500" values="0;1;0"/></rect>
  <g data-role="switch">
    <text class="font-mono text-offset fill-ink" x="480" y="142">String describe(DecodeResult result) {</text>
    <text data-role="switch-line" class="font-mono text-offset fill-ink" x="509" y="162">return switch (result) {</text>
    <text data-role="case" data-type="Decoded" class="font-mono text-offset fill-ink" x="538" y="182">case <tspan data-role="type-name" data-type="Decoded" class="font-semibold fill-sky">Decoded</tspan> d -&gt; &quot;seat &quot; + d.pass().seat();</text>
    <text data-role="case" data-type="Rejected" class="font-mono text-offset fill-ink" x="538" y="202">case <tspan data-role="type-name" data-type="Rejected" class="font-semibold fill-pink">Rejected</tspan> r -&gt; &quot;rejected: &quot; + r.reason();</text>
    <text data-role="case" data-type="Expired" class="font-mono text-offset fill-ink" x="538" y="222">case <tspan data-role="type-name" data-type="Expired" class="font-semibold fill-amber">Expired</tspan> e -&gt; &quot;expired: &quot; + e.pass().flight();<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7500" values="0;1"/></text>
    <g data-role="closers">
      <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7500" values="1;0"/>
      <rect data-role="no-default-highlight" class="fill-none stroke-amber stroke-1.5" x="532" y="208" width="106.9" height="20" rx="4"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4000;0.5000;0.8500" values="0;1;0;1"/></rect>
      <text data-role="no-default" class="font-mono text-offset fill-ink-muted" x="538" y="222">// no default</text>
      <text class="font-mono text-offset fill-ink" x="509" y="242">};</text>
      <text class="font-mono text-offset fill-ink" x="480" y="262">}</text>
    </g>
    <g data-role="closers">
      <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7500" values="0;1"/>
      <rect data-role="no-default-highlight" class="fill-none stroke-amber stroke-1.5" x="532" y="228" width="106.9" height="20" rx="4"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4000;0.5000;0.8500" values="0;1;0;1"/></rect>
      <text data-role="no-default" class="font-mono text-offset fill-ink-muted" x="538" y="242">// no default</text>
      <text class="font-mono text-offset fill-ink" x="509" y="262">};</text>
      <text class="font-mono text-offset fill-ink" x="480" y="282">}</text>
    </g>
  </g>
  <rect class="la-canvas stroke-1.5" x="24" y="316" width="912" height="48" rx="12"/>
  <text class="la-label font-semibold" x="40" y="345">javac</text>
  <g data-role="verdict" data-verdict="checking">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2500;0.4000;0.5000;0.6000;0.7500;0.8500" values="0;1;0;1;0;1;0"/>
    <text class="la-note" x="104" y="345">checking that every subtype in the permits clause has a case</text>
  </g>
  <g data-role="verdict" data-verdict="compiles">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4000;0.5000;0.8500" values="0;1;0;1"/>
    <path class="fill-none stroke-emerald stroke-1.5" d="M 104 341 l 4 4 l 8 -9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="font-sans text-label" x="124" y="345"><tspan class="font-semibold fill-emerald">compiles</tspan><tspan class="fill-ink-muted">: every permitted subtype has a case, so the switch needs no default</tspan></text>
  </g>
  <g data-role="verdict" data-verdict="error">
    <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6000;0.7500" values="0;1;0"/>
    <path class="fill-none stroke-red stroke-1.5" d="M 105 336 l 9 9 m 0 -9 l -9 9" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="font-mono text-offset fill-red" x="124" y="345">error: the switch expression does not cover all possible input values</text>
  </g>
  <rect class="la-canvas" x="24" y="380" width="912" height="36" rx="8"/>
  <text data-role="caption" class="font-sans text-label fill-ink anchor-middle" x="480" y="403">The permits clause names every subtype of DecodeResult: Decoded and Rejected. No other class can implement it.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2500" values="1;0"/></text>
  <text data-role="caption" class="font-sans text-label fill-ink anchor-middle" x="480" y="403">The switch has a case for each permitted subtype. The compiler knows there are no others, so the switch needs no default.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000" values="0;1;0"/></text>
  <text data-role="caption" class="font-sans text-label fill-ink anchor-middle" x="480" y="403">Expired joins the permits clause. The switch has no case for it, so the build fails right at that switch.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5000;0.7500" values="0;1;0"/></text>
  <text data-role="caption" class="font-sans text-label fill-ink anchor-middle" x="480" y="403">With case Expired e added, the switch covers all three subtypes again and compiles, still with no default.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7500" values="0;1"/></text>
  <text class="font-sans text-offset fill-ink-muted" x="28" y="446">Sources: JEP 409 (Sealed Classes) and JEP 441 (Pattern Matching for switch). The error is javac's own message, checked with JDK 25.</text>
</svg>
