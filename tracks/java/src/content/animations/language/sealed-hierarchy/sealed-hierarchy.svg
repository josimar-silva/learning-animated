<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" role="img" data-loop="20s">
  <title>A sealed hierarchy</title>
  <desc>On the left, sealed interface DecodeResult permits two records, Decoded and Rejected, drawn as a tree under the interface. On the right, a switch over a DecodeResult has one case for each record and a comment saying it has no default. javac checks the switch, marks Decoded and Rejected covered, and the switch compiles. Then a third record, Expired, joins the permits clause and the tree. javac checks again, finds no case for Expired, and fails at the switch with the error: the switch expression does not cover all possible input values. Last, the switch gets case Expired e, javac marks Expired covered, and the switch compiles again, still with no default.</desc>
  <style>
