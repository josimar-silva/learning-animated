<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Kafka: The Definitive Guide Animated</title>
  <desc id="logo-desc">Three partitions drawn as append-only logs on a dark panel, with a producer writing to the amber tail and a consumer reading from the head.</desc>

  <!-- Panel: reads on both light and dark GitHub themes -->
  <rect x="24" y="24" width="352" height="352" rx="56" fill="#191426" stroke="#302a4d" stroke-width="2"/>

  <!-- Three partitions, each an append-only log. The rightmost cell is the tail
       where new messages land (amber), mirroring the topic-partitions animation. -->
  <g stroke-width="3">
    <!-- Partition 0 -->
    <rect x="74"  y="93"  width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="136" y="93"  width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="198" y="93"  width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="260" y="93"  width="46" height="46" rx="10" fill="#4a3410" stroke="#f6a723"/>
    <!-- Partition 1 -->
    <rect x="74"  y="177" width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="136" y="177" width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="198" y="177" width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="260" y="177" width="46" height="46" rx="10" fill="#4a3410" stroke="#f6a723"/>
    <!-- Partition 2 -->
    <rect x="74"  y="261" width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="136" y="261" width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="198" y="261" width="46" height="46" rx="10" fill="#2a2246" stroke="#7c6ac4"/>
    <rect x="260" y="261" width="46" height="46" rx="10" fill="#4a3410" stroke="#f6a723"/>
  </g>

  <!-- Producer appends to the tail of partition 0 -->
  <g fill="#10b981" stroke="#10b981">
    <line x1="283" y1="56" x2="283" y2="82" stroke-width="6" stroke-linecap="round"/>
    <polygon points="283,92 271,74 295,74" stroke="none"/>
  </g>

  <!-- Consumer reads from the head of partition 2 -->
  <g fill="#38bdf8" stroke="#38bdf8">
    <line x1="70" y1="284" x2="52" y2="284" stroke-width="6" stroke-linecap="round"/>
    <polygon points="36,284 54,272 54,296" stroke="none"/>
  </g>
</svg>
