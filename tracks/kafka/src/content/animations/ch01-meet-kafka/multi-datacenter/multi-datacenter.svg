<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 680" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Multiple datacenter architecture</title>
  <desc>Three datacenters. In A and B, local producers and consumers use a local Kafka cluster,
  and a MirrorMaker consumes both local clusters and produces into an aggregate cluster. Datacenter
  C reads a mirrored aggregate: its MirrorMaker consumes datacenter B's aggregate and produces into
  a local aggregate that two consumers read.</desc>
  <style>
