<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Kafka producer components</title>
  <desc>A record is built, serialized, partitioned, batched, and sent to a Kafka broker. The loop
  shows a successful send returning metadata, a retriable error being retried, and a
  non-retriable error throwing back to the caller.</desc>
  <style>
/* LA-STYLE:START */
:root {
  --color-stage: #0e0b16;
  --color-surface: #191426;
  --color-ink: #ece9f7;
  --color-ink-muted: #a9a3ca;
  --color-grid: #302a4d;
  --color-cell: #2a2246;
  --color-cell-stroke: #7c6ac4;
  --color-cell-ink: #e2ddf5;
  --color-cell-new: #4a3410;
  --color-amber: #f6a723;
  --color-emerald: #34d399;
  --color-green: #10b981;
  --color-sky: #38bdf8;
  --color-sky-light: #7dd3fc;
  --color-violet: #9075e8;
  --color-violet-deep: #221b3e;
  --color-lime: #65a30d;
  --color-lime-deep: #1e2610;
  --color-slate: #8992aa;
  --color-pink: #f472b6;
  --color-red: #f87171;
  --color-flow: #a8a1cf;
  --color-flow-strong: #f1edff;
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  --text-title: 20px;
  --text-label: 13px;
  --text-offset: 12px;
}
.fill-stage { fill: var(--color-stage); }
.stroke-stage { stroke: var(--color-stage); }
.fill-surface { fill: var(--color-surface); }
.stroke-surface { stroke: var(--color-surface); }
.fill-ink { fill: var(--color-ink); }
.stroke-ink { stroke: var(--color-ink); }
.fill-ink-muted { fill: var(--color-ink-muted); }
.stroke-ink-muted { stroke: var(--color-ink-muted); }
.fill-grid { fill: var(--color-grid); }
.stroke-grid { stroke: var(--color-grid); }
.fill-cell { fill: var(--color-cell); }
.stroke-cell { stroke: var(--color-cell); }
.fill-cell-stroke { fill: var(--color-cell-stroke); }
.stroke-cell-stroke { stroke: var(--color-cell-stroke); }
.fill-cell-ink { fill: var(--color-cell-ink); }
.stroke-cell-ink { stroke: var(--color-cell-ink); }
.fill-cell-new { fill: var(--color-cell-new); }
.stroke-cell-new { stroke: var(--color-cell-new); }
.fill-amber { fill: var(--color-amber); }
.stroke-amber { stroke: var(--color-amber); }
.fill-emerald { fill: var(--color-emerald); }
.stroke-emerald { stroke: var(--color-emerald); }
.fill-green { fill: var(--color-green); }
.stroke-green { stroke: var(--color-green); }
.fill-sky { fill: var(--color-sky); }
.stroke-sky { stroke: var(--color-sky); }
.fill-sky-light { fill: var(--color-sky-light); }
.stroke-sky-light { stroke: var(--color-sky-light); }
.fill-violet { fill: var(--color-violet); }
.stroke-violet { stroke: var(--color-violet); }
.fill-violet-deep { fill: var(--color-violet-deep); }
.stroke-violet-deep { stroke: var(--color-violet-deep); }
.fill-lime { fill: var(--color-lime); }
.stroke-lime { stroke: var(--color-lime); }
.fill-lime-deep { fill: var(--color-lime-deep); }
.stroke-lime-deep { stroke: var(--color-lime-deep); }
.fill-slate { fill: var(--color-slate); }
.stroke-slate { stroke: var(--color-slate); }
.fill-pink { fill: var(--color-pink); }
.stroke-pink { stroke: var(--color-pink); }
.fill-red { fill: var(--color-red); }
.stroke-red { stroke: var(--color-red); }
.fill-flow { fill: var(--color-flow); }
.stroke-flow { stroke: var(--color-flow); }
.fill-flow-strong { fill: var(--color-flow-strong); }
.stroke-flow-strong { stroke: var(--color-flow-strong); }
.font-sans { font-family: var(--font-sans); }
.font-mono { font-family: var(--font-mono); }
.text-title { font-size: var(--text-title); }
.text-label { font-size: var(--text-label); }
.text-offset { font-size: var(--text-offset); }
.fill-none { fill: none; }
.stroke-none { stroke: none; }
.stroke-1\.5 { stroke-width: 1.5; }
.stroke-2\.5 { stroke-width: 2.5; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.anchor-start { text-anchor: start; }
.anchor-middle { text-anchor: middle; }
.anchor-end { text-anchor: end; }
.halo { paint-order: stroke; stroke: var(--color-stage); stroke-width: 3px; stroke-linejoin: round; }
.la-canvas { fill: var(--color-surface); stroke: var(--color-grid); }
.la-card { fill: var(--color-violet-deep); stroke: var(--color-violet); stroke-width: 1.5; }
.la-cell { fill: var(--color-cell); stroke: var(--color-cell-stroke); stroke-width: 1.5; }
.la-cell-new { fill: var(--color-cell-new); stroke: var(--color-amber); stroke-width: 1.5; }
.la-cell-tail { fill: var(--color-surface); stroke: var(--color-cell-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
.la-offset { font-family: var(--font-mono); font-size: var(--text-offset); fill: var(--color-cell-ink); }
.la-title { font-family: var(--font-sans); font-size: var(--text-title); font-weight: 600; fill: var(--color-ink); }
.la-label { font-family: var(--font-sans); font-size: var(--text-label); fill: var(--color-ink); }
.la-note { font-family: var(--font-sans); font-size: var(--text-label); fill: var(--color-ink-muted); }
.la-arrow { fill: none; stroke: var(--color-flow); stroke-width: 1.5; }
.la-flow-dot { fill: var(--color-amber); }
.la-read-marker { fill: none; stroke: var(--color-emerald); stroke-width: 2.5; }
/* LA-STYLE:END */
</style>
  <defs>
    <marker id="kf-head-flow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="fill-flow" d="M 0 0 L 9 4.5 L 0 9 Z" />
    </marker>
    <marker id="kf-head-ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="fill-emerald" d="M 0 0 L 9 4.5 L 0 9 Z" />
    </marker>
    <marker id="kf-head-fail" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="fill-red" d="M 0 0 L 9 4.5 L 0 9 Z" />
    </marker>

    <path id="m-descend" class="fill-none stroke-none" d="M 600 148 L 600 205 L 600 257 L 600 288 L 502 288 L 502 430 L 502 474 L 600 474 L 600 500" />
    <path id="m-respond" class="fill-none stroke-none" d="M 600 516 L 300 516 L 300 482" />
    <path id="m-metadata" class="fill-none stroke-none" d="M 266 452 L 46 452 L 46 96 L 500 96" />
    <path id="m-escalate" class="fill-none stroke-none" d="M 300 422 L 300 390" />
    <path id="m-retry" class="fill-none stroke-none" d="M 334 360 L 420 360" />
    <path id="m-exception" class="fill-none stroke-none" d="M 266 360 L 118 360 L 118 132 L 500 132" />
  </defs>

  <rect class="la-canvas" x="8" y="8" width="944" height="544" rx="16" />

  <g data-role="producer-record">
    <rect class="la-card" x="500" y="24" width="200" height="124" rx="10" />
    <text class="la-label font-semibold" x="600" y="44" text-anchor="middle">ProducerRecord</text>
    <g data-role="field" data-field="topic">
      <rect class="la-cell" x="512" y="52" width="176" height="20" rx="4" />
      <text class="font-sans text-label fill-cell-ink" x="600" y="67" text-anchor="middle">Topic</text>
    </g>
    <g data-role="field" data-field="partition">
      <rect class="la-cell" x="512" y="76" width="176" height="20" rx="4" />
      <text class="font-sans text-label fill-cell-ink" x="600" y="91" text-anchor="middle">[Partition]</text>
    </g>
    <g data-role="field" data-field="key">
      <rect class="la-cell" x="512" y="100" width="176" height="20" rx="4" />
      <text class="font-sans text-label fill-cell-ink" x="600" y="115" text-anchor="middle">[Key]</text>
    </g>
    <g data-role="field" data-field="value">
      <rect class="la-cell" x="512" y="124" width="176" height="20" rx="4" />
      <text class="font-sans text-label fill-cell-ink" x="600" y="139" text-anchor="middle">Value</text>
    </g>
  </g>

  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 600 148 L 600 178" />
  <text class="la-note" x="612" y="168" text-anchor="start">send()</text>

  <rect stroke-dasharray="6 5" data-role="producer-boundary" class="fill-none stroke-ink-muted stroke-1.5" x="214" y="178" width="580" height="306" rx="14" />

  <g data-role="stage" data-stage="serializer">
    <rect class="fill-surface stroke-cell-stroke stroke-1.5" x="526" y="188" width="148" height="34" rx="8" />
    <text class="la-label font-semibold" x="600" y="210" text-anchor="middle">Serializer</text>
  </g>

  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 600 222 L 600 240" />

  <g data-role="stage" data-stage="partitioner">
    <rect class="fill-surface stroke-cell-stroke stroke-1.5" x="526" y="240" width="148" height="34" rx="8" />
    <text class="la-label font-semibold" x="600" y="262" text-anchor="middle">Partitioner</text>
  </g>

  <path class="la-arrow" d="M 600 274 L 600 288" />
  <path class="la-arrow" d="M 502 288 L 698 288" />
  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 502 288 L 502 300" />
  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 698 288 L 698 300" />

  <g data-role="buffer" data-topic="A" data-partition="0">
    <rect class="la-card" x="420" y="300" width="164" height="162" rx="10" />
    <text class="la-label" x="502" y="322" text-anchor="middle">Topic A</text>
    <text class="la-label" x="502" y="340" text-anchor="middle">Partition 0</text>
    <g data-role="batch" data-batch="0">
      <rect class="la-cell" x="436" y="350" width="132" height="28" rx="5" />
      <text class="la-offset" x="502" y="369" text-anchor="middle">Batch 0</text>
    </g>
    <g data-role="batch" data-batch="1">
      <rect class="la-cell" x="436" y="382" width="132" height="28" rx="5" />
      <text class="la-offset" x="502" y="401" text-anchor="middle">Batch 1</text>
    </g>
    <g data-role="batch" data-batch="2">
      <rect class="la-cell" x="436" y="414" width="132" height="28" rx="5" />
      <text class="la-offset" x="502" y="433" text-anchor="middle">Batch 2</text>
    </g>
  </g>

  <g data-role="buffer" data-topic="B" data-partition="1">
    <rect class="la-card" x="616" y="300" width="164" height="162" rx="10" />
    <text class="la-label" x="698" y="322" text-anchor="middle">Topic B</text>
    <text class="la-label" x="698" y="340" text-anchor="middle">Partition 1</text>
    <g data-role="batch" data-batch="0">
      <rect class="la-cell" x="632" y="350" width="132" height="28" rx="5" />
      <text class="la-offset" x="698" y="369" text-anchor="middle">Batch 0</text>
    </g>
    <g data-role="batch" data-batch="1">
      <rect class="la-cell" x="632" y="382" width="132" height="28" rx="5" />
      <text class="la-offset" x="698" y="401" text-anchor="middle">Batch 1</text>
    </g>
    <g data-role="batch" data-batch="2">
      <rect class="la-cell" x="632" y="414" width="132" height="28" rx="5" />
      <text class="la-offset" x="698" y="433" text-anchor="middle">Batch 2</text>
    </g>
  </g>

  <path class="la-arrow" d="M 502 462 L 502 474 L 600 474" />
  <path class="la-arrow" d="M 698 462 L 698 474 L 600 474" />
  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 600 474 L 600 490" />

  <g data-role="broker">
    <path class="la-card" d="M 512 502 L 512 530 A 88 11 0 0 0 688 530 L 688 502 Z" />
    <ellipse class="la-card" cx="600" cy="502" rx="88" ry="11" />
    <text class="la-label font-semibold" x="600" y="521" text-anchor="middle">Kafka Broker</text>
  </g>

  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 512 516 L 300 516 L 300 482" />

  <g data-role="decision" data-decision="retry">
    <polygon class="fill-surface stroke-amber stroke-1.5" points="300,330 334,360 300,390 266,360" />
    <text class="la-label font-semibold" x="300" y="365" text-anchor="middle">Retry?</text>
  </g>

  <g data-role="decision" data-decision="fail">
    <polygon class="fill-surface stroke-amber stroke-1.5" points="300,422 334,452 300,482 266,452" />
    <text class="la-label font-semibold" x="300" y="457" text-anchor="middle">Fail?</text>
  </g>

  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 300 422 L 300 390" />
  <text class="la-note" x="312" y="410" text-anchor="start">Yes</text>

  <path class="la-arrow" marker-end="url(#kf-head-flow)" d="M 334 360 L 420 360" />
  <text class="la-note" x="377" y="350" text-anchor="middle">Yes</text>

  <g data-role="return-path" data-return="metadata">
    <path class="fill-none stroke-emerald stroke-1.5" marker-end="url(#kf-head-ok)" d="M 266 452 L 46 452 L 46 96 L 500 96" />
    <text class="la-note" x="258" y="444" text-anchor="end">No</text>
    <text class="la-note" x="150" y="88" text-anchor="start">When successful, return Metadata</text>
  </g>

  <g data-role="return-path" data-return="exception">
    <path class="fill-none stroke-red stroke-1.5" marker-end="url(#kf-head-fail)" d="M 266 360 L 118 360 L 118 132 L 500 132" />
    <text class="la-note" x="258" y="352" text-anchor="end">No</text>
    <text class="la-note" x="150" y="124" text-anchor="start">If can't retry, throw exception</text>
  </g>

  <g data-role="caption" data-phase="success" opacity="1">
    <text class="la-title" x="46" y="44" text-anchor="start">Send succeeds: metadata returns</text>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.33;0.34;1" />
  </g>

  <g data-role="caption" data-phase="retry" opacity="0">
    <text class="la-title" x="46" y="44" text-anchor="start">Retriable error: the batch is retried</text>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.67;0.68;1" />
  </g>

  <g data-role="caption" data-phase="exception" opacity="0">
    <text class="la-title" x="46" y="44" text-anchor="start">Non-retriable error: exception thrown</text>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.67;0.68;1" />
  </g>

  <g data-role="phase" data-phase="success">
    <g data-role="flow" data-flow="descend">
      <circle class="fill-amber" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.13;1" rotate="0">
          <mpath xlink:href="#m-descend" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.02;0.025;0.13;0.135;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="respond">
      <circle class="fill-amber" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.15;0.21;1" rotate="0">
          <mpath xlink:href="#m-respond" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.15;0.155;0.21;0.215;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="metadata">
      <circle class="fill-emerald" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.23;0.32;1" rotate="0">
          <mpath xlink:href="#m-metadata" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.23;0.235;0.32;0.325;1" />
      </circle>
    </g>
  </g>

  <g data-role="phase" data-phase="retry">
    <g data-role="flow" data-flow="descend">
      <circle class="fill-amber" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.36;0.47;1" rotate="0">
          <mpath xlink:href="#m-descend" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.36;0.365;0.47;0.475;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="respond">
      <circle class="fill-amber" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.49;0.55;1" rotate="0">
          <mpath xlink:href="#m-respond" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.49;0.495;0.55;0.555;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="escalate">
      <circle class="fill-red" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.57;0.6;1" rotate="0">
          <mpath xlink:href="#m-escalate" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.57;0.575;0.6;0.605;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="retry">
      <circle class="fill-amber" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.66;1" rotate="0">
          <mpath xlink:href="#m-retry" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.62;0.625;0.66;0.665;1" />
      </circle>
    </g>
  </g>

  <g data-role="phase" data-phase="exception">
    <g data-role="flow" data-flow="descend">
      <circle class="fill-amber" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7;0.81;1" rotate="0">
          <mpath xlink:href="#m-descend" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.705;0.81;0.815;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="respond">
      <circle class="fill-amber" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.83;0.88;1" rotate="0">
          <mpath xlink:href="#m-respond" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.83;0.835;0.88;0.885;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="escalate">
      <circle class="fill-red" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.89;0.92;1" rotate="0">
          <mpath xlink:href="#m-escalate" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.89;0.895;0.92;0.925;1" />
      </circle>
    </g>
    <g data-role="flow" data-flow="exception">
      <circle class="fill-red" r="6" opacity="0">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.94;0.99;1" rotate="0">
          <mpath xlink:href="#m-exception" />
        </animateMotion>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.94;0.945;0.99;0.995;1" />
      </circle>
    </g>
  </g>
</svg>
