<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Serialization and deserialization of Avro records</title>
  <desc>A producer sends the current version of its schema to the Schema Registry, then writes a
  message carrying only a schema ID through the Kafka broker. The consumer receives the message and
  reads the matching schema from the registry to deserialize it.</desc>
  <style>
/* LA-STYLE:START */
:root {
  --color-stage: #0e0b16;
  --color-surface: #191426;
  --color-ink: #ece9f7;
  --color-ink-muted: #a9a3ca;
  --color-grid: #302a4d;
  --color-cell: #2a2246;
  --color-cell-stroke: #7c6ac4;
  --color-cell-ink: #e2ddf5;
  --color-cell-new: #4a3410;
  --color-amber: #f6a723;
  --color-emerald: #34d399;
  --color-green: #10b981;
  --color-sky: #38bdf8;
  --color-sky-light: #7dd3fc;
  --color-violet: #9075e8;
  --color-violet-deep: #221b3e;
  --color-lime: #65a30d;
  --color-lime-deep: #1e2610;
  --color-slate: #8992aa;
  --color-pink: #f472b6;
  --color-red: #f87171;
  --color-flow: #a8a1cf;
  --color-flow-strong: #f1edff;
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  --text-title: 20px;
  --text-label: 13px;
  --text-offset: 12px;
}
.fill-stage { fill: var(--color-stage); }
.stroke-stage { stroke: var(--color-stage); }
.fill-surface { fill: var(--color-surface); }
.stroke-surface { stroke: var(--color-surface); }
.fill-ink { fill: var(--color-ink); }
.stroke-ink { stroke: var(--color-ink); }
.fill-ink-muted { fill: var(--color-ink-muted); }
.stroke-ink-muted { stroke: var(--color-ink-muted); }
.fill-grid { fill: var(--color-grid); }
.stroke-grid { stroke: var(--color-grid); }
.fill-cell { fill: var(--color-cell); }
.stroke-cell { stroke: var(--color-cell); }
.fill-cell-stroke { fill: var(--color-cell-stroke); }
.stroke-cell-stroke { stroke: var(--color-cell-stroke); }
.fill-cell-ink { fill: var(--color-cell-ink); }
.stroke-cell-ink { stroke: var(--color-cell-ink); }
.fill-cell-new { fill: var(--color-cell-new); }
.stroke-cell-new { stroke: var(--color-cell-new); }
.fill-amber { fill: var(--color-amber); }
.stroke-amber { stroke: var(--color-amber); }
.fill-emerald { fill: var(--color-emerald); }
.stroke-emerald { stroke: var(--color-emerald); }
.fill-green { fill: var(--color-green); }
.stroke-green { stroke: var(--color-green); }
.fill-sky { fill: var(--color-sky); }
.stroke-sky { stroke: var(--color-sky); }
.fill-sky-light { fill: var(--color-sky-light); }
.stroke-sky-light { stroke: var(--color-sky-light); }
.fill-violet { fill: var(--color-violet); }
.stroke-violet { stroke: var(--color-violet); }
.fill-violet-deep { fill: var(--color-violet-deep); }
.stroke-violet-deep { stroke: var(--color-violet-deep); }
.fill-lime { fill: var(--color-lime); }
.stroke-lime { stroke: var(--color-lime); }
.fill-lime-deep { fill: var(--color-lime-deep); }
.stroke-lime-deep { stroke: var(--color-lime-deep); }
.fill-slate { fill: var(--color-slate); }
.stroke-slate { stroke: var(--color-slate); }
.fill-pink { fill: var(--color-pink); }
.stroke-pink { stroke: var(--color-pink); }
.fill-red { fill: var(--color-red); }
.stroke-red { stroke: var(--color-red); }
.fill-flow { fill: var(--color-flow); }
.stroke-flow { stroke: var(--color-flow); }
.fill-flow-strong { fill: var(--color-flow-strong); }
.stroke-flow-strong { stroke: var(--color-flow-strong); }
.font-sans { font-family: var(--font-sans); }
.font-mono { font-family: var(--font-mono); }
.text-title { font-size: var(--text-title); }
.text-label { font-size: var(--text-label); }
.text-offset { font-size: var(--text-offset); }
.fill-none { fill: none; }
.stroke-none { stroke: none; }
.stroke-1\.5 { stroke-width: 1.5; }
.stroke-2\.5 { stroke-width: 2.5; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.anchor-start { text-anchor: start; }
.anchor-middle { text-anchor: middle; }
.anchor-end { text-anchor: end; }
.halo { paint-order: stroke; stroke: var(--color-stage); stroke-width: 3px; stroke-linejoin: round; }
.la-canvas { fill: var(--color-surface); stroke: var(--color-grid); }
.la-card { fill: var(--color-violet-deep); stroke: var(--color-violet); stroke-width: 1.5; }
.la-cell { fill: var(--color-cell); stroke: var(--color-cell-stroke); stroke-width: 1.5; }
.la-cell-new { fill: var(--color-cell-new); stroke: var(--color-amber); stroke-width: 1.5; }
.la-cell-tail { fill: var(--color-surface); stroke: var(--color-cell-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
.la-offset { font-family: var(--font-mono); font-size: var(--text-offset); fill: var(--color-cell-ink); }
.la-title { font-family: var(--font-sans); font-size: var(--text-title); font-weight: 600; fill: var(--color-ink); }
.la-label { font-family: var(--font-sans); font-size: var(--text-label); fill: var(--color-ink); }
.la-note { font-family: var(--font-sans); font-size: var(--text-label); fill: var(--color-ink-muted); }
.la-arrow { fill: none; stroke: var(--color-flow); stroke-width: 1.5; }
.la-flow-dot { fill: var(--color-amber); }
.la-read-marker { fill: none; stroke: var(--color-emerald); stroke-width: 2.5; }
/* LA-STYLE:END */
</style>
  <defs>
    <marker id="kf-head-flow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="fill-flow" d="M 0 0 L 9 4.5 L 0 9 Z" />
    </marker>
    <marker id="kf-head-schema" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="fill-lime" d="M 0 0 L 9 4.5 L 0 9 Z" />
    </marker>

    <path id="m-register" class="fill-none stroke-none" d="M 164 206 L 164 430 L 410 430" />
    <path id="m-produce" class="fill-none stroke-none" d="M 264 151 L 418 151" />
    <path id="m-deliver" class="fill-none stroke-none" d="M 542 151 L 696 151" />
    <path id="m-fetch" class="fill-none stroke-none" d="M 550 430 L 796 430 L 796 206" />
  </defs>

  <rect class="la-canvas" x="8" y="8" width="944" height="544" rx="16" />

  <g data-role="actor" data-actor="producer">
    <rect class="fill-violet-deep stroke-1.5 stroke-emerald" x="64" y="96" width="200" height="110" rx="14" />
    <text class="la-label font-semibold" x="164" y="124" text-anchor="middle">Producer</text>
    <g data-role="codec" data-codec="serializer">
      <rect class="fill-green stroke-emerald stroke-1.5" x="84" y="138" width="160" height="44" rx="8" />
      <text class="font-sans text-label font-semibold fill-surface" x="164" y="165" text-anchor="middle">Serializer</text>
      <rect class="la-read-marker" x="80" y="134" width="168" height="52" rx="10" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.22;0.27;0.32;1" />
      </rect>
    </g>
  </g>

  <g data-role="actor" data-actor="broker">
    <path class="la-card" d="M 418 112 A 62 16 0 0 1 542 112 L 542 190 A 62 16 0 0 1 418 190 Z" />
    <path class="fill-none stroke-violet stroke-1.5" d="M 418 112 A 62 16 0 0 0 542 112" />
    <text class="la-label font-semibold" x="480" y="146" text-anchor="middle">Kafka</text>
    <text class="la-label font-semibold" x="480" y="164" text-anchor="middle">Broker</text>
  </g>

  <g data-role="actor" data-actor="consumer">
    <rect class="fill-violet-deep stroke-1.5 stroke-sky-light" x="696" y="96" width="200" height="110" rx="14" />
    <text class="la-label font-semibold" x="796" y="124" text-anchor="middle">Consumer</text>
    <g data-role="codec" data-codec="deserializer">
      <rect class="fill-sky stroke-sky-light stroke-1.5" x="716" y="138" width="160" height="44" rx="8" />
      <text class="font-sans text-label font-semibold fill-surface" x="796" y="165" text-anchor="middle">Deserializer</text>
      <rect class="fill-none stroke-2.5 stroke-sky-light" x="712" y="134" width="168" height="52" rx="10" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.84;0.89;0.94;1" />
      </rect>
    </g>
  </g>

  <g data-role="actor" data-actor="registry">
    <path class="fill-lime-deep stroke-lime stroke-1.5" d="M 410 400 A 70 18 0 0 1 550 400 L 550 460 A 70 18 0 0 1 410 460 Z" />
    <path class="fill-none stroke-lime stroke-1.5" d="M 410 400 A 70 18 0 0 0 550 400" />
    <text class="la-label font-semibold" x="480" y="424" text-anchor="middle">Schema</text>
    <text class="la-label font-semibold" x="480" y="442" text-anchor="middle">Registry</text>
  </g>

  <g data-role="flow" data-flow="schema-register" data-from="producer" data-to="registry" data-payload="schema">
    <path class="fill-none stroke-lime stroke-1.5" d="M 164 206 L 164 430 L 404 430" marker-end="url(#kf-head-schema)" />
    <text class="la-note" x="287" y="400" text-anchor="middle">Current version</text>
    <text class="la-note" x="287" y="416" text-anchor="middle">of schema</text>
    <g opacity="0">
      <rect class="fill-lime-deep stroke-lime stroke-1.5" x="-40" y="-12" width="80" height="24" rx="5" />
      <text class="font-mono text-offset fill-ink" x="0" y="4" text-anchor="middle">schema v1</text>
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.03;0.21;1">
        <mpath xlink:href="#m-register" />
      </animateMotion>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.01;0.05;0.19;0.23;1" />
    </g>
  </g>

  <g data-role="flow" data-flow="produce" data-from="producer" data-to="broker" data-payload="schema-id">
    <path class="la-arrow" d="M 264 151 L 414 151" marker-end="url(#kf-head-flow)" />
    <text class="la-note" x="341" y="124" text-anchor="middle">Message with</text>
    <text class="la-note" x="341" y="140" text-anchor="middle">schema ID</text>
    <g opacity="0">
      <rect class="la-cell" x="-24" y="-11" width="48" height="22" rx="5" />
      <text class="la-offset" x="0" y="4" text-anchor="middle">id 1</text>
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.28;0.46;1">
        <mpath xlink:href="#m-produce" />
      </animateMotion>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.26;0.30;0.44;0.48;1" />
    </g>
  </g>

  <g data-role="flow" data-flow="deliver" data-from="broker" data-to="consumer" data-payload="schema-id">
    <path class="la-arrow" d="M 542 151 L 692 151" marker-end="url(#kf-head-flow)" />
    <g opacity="0">
      <rect class="la-cell" x="-24" y="-11" width="48" height="22" rx="5" />
      <text class="la-offset" x="0" y="4" text-anchor="middle">id 1</text>
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.48;0.64;1">
        <mpath xlink:href="#m-deliver" />
      </animateMotion>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.46;0.50;0.62;0.66;1" />
    </g>
  </g>

  <g data-role="flow" data-flow="schema-fetch" data-from="registry" data-to="consumer" data-payload="schema">
    <path class="fill-none stroke-lime stroke-1.5" d="M 550 430 L 796 430 L 796 212" marker-end="url(#kf-head-schema)" />
    <g opacity="0">
      <rect class="fill-lime-deep stroke-lime stroke-1.5" x="-40" y="-12" width="80" height="24" rx="5" />
      <text class="font-mono text-offset fill-ink" x="0" y="4" text-anchor="middle">schema v1</text>
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.66;0.84;1">
        <mpath xlink:href="#m-fetch" />
      </animateMotion>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.64;0.68;0.82;0.86;1" />
    </g>
  </g>
</svg>
