        <text class="font-sans text-offset fill-ink-muted" x="744" y="480">dropped</text>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.51;0.55;0.92;0.96;1" />
