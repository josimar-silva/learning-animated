    </g>

    <text class="font-sans text-label font-semibold fill-emerald" x="890" y="362" text-anchor="end" data-role="outcome" data-outcome="decoded" opacity="0">decoded
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.62;0.92;0.96;1" />
