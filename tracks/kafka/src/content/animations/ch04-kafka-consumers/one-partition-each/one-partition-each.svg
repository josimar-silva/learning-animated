  <defs>
    <marker id="kf-head-flow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="fill-flow" d="M 0 0 L 9 4.5 L 0 9 Z" />
    </marker>
    <marker id="kf-head-new" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path class="fill-amber" d="M 0 0 L 9 4.5 L 0 9 Z" />
    </marker>
  </defs>

  <rect class="la-canvas" x="8" y="8" width="944" height="544" rx="16" />

  <g data-role="caption" data-phase="before">
    <text class="la-title" x="150" y="52">Two consumers, two partitions each</text>
    <text class="la-note" x="150" y="76">Consumer 1 reads partitions 0 and 2, and Consumer 2 reads 1 and 3.</text>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.19;0.21;0.97;1" />
  </g>
  <g data-role="caption" data-phase="change" opacity="0">
    <text class="la-title" x="150" y="52">Consumers 3 and 4 join</text>
    <text class="la-note" x="150" y="76">The group rebalances: partition 2 moves to Consumer 3, and 3 to Consumer 4.</text>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.38;0.4;1" />
  </g>
  <g data-role="caption" data-phase="after" opacity="0">
    <text class="la-title" x="150" y="52">One partition each</text>
    <text class="la-note" x="150" y="76">Four consumers for four partitions. The work cannot be split any further.</text>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.94;0.96;1" />
  </g>

