<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Four consumers, one partition each</title>
  <desc>Two consumers share the four partitions of topic T1 until Consumers 3 and 4 join. The
  group rebalances, partition 2 moves to Consumer 3 and partition 3 to Consumer 4, and each of
  the four consumers ends up reading exactly one partition.</desc>
  <style>
